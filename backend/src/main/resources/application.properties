# ===================================
# Portfolio Backend - Application Config
# ===================================

# Server Port
server.port=8080
server.address=0.0.0.0

# ===================================
# Database MySQL Railway
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / Hibernate
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Upload file
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Folder penyimpanan foto (buat folder ini manual di dalam project backend)
file.upload-dir=uploads/photos

# ===================================
# CORS (untuk integrasi Frontend)
# ===================================
spring.web.cors.allowed-origins=*

# ===================================
# App Name
# ===================================
spring.application.name=portfolio-backend
